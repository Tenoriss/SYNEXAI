<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SYNEX AI — AI-powered system analysis workspace." />
    <title>SYNEX AI</title>
    <script>
      // Apply the stored theme before first paint to avoid a light/dark flash.
      (function () {
        try {
          var raw = localStorage.getItem('synex_settings');
          var theme = raw ? (JSON.parse(raw).data || {}).theme : 'system';
          var dark = theme === 'dark' || ((!theme || theme === 'system') && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
